<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Professional Task Automation</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <!-- NAVBAR -->
    <nav
      class="navbar px-4 py-3 bg-white shadow-sm d-flex justify-content-between"
    >
      <span class="fw-bold fs-5">
        <i class="fa-solid fa-list-check text-primary"></i> Task Automation
      </span>

      <button
        id="darkToggleBtn"
        class="btn btn-outline-dark btn-sm"
        onclick="toggleDarkMode()"
      >
        <i class="fa-solid fa-moon"></i>
      </button>
    </nav>

    <div class="container-fluid py-4 px-4 main-wrapper">
      <div class="row g-4 h-100">
        <!-- LEFT PANEL -->
        <div class="col-lg-5 left-panel">
          <div class="card generator-card">
            <div class="card-body d-flex flex-column">
              <h5 class="fw-bold mb-3">
                <i class="fa-solid fa-paste text-primary"></i> Text Generator
              </h5>

              <textarea
                id="inputText"
                class="form-control mb-3 flex-grow-1"
                placeholder="Paste pesan disini..."
              ></textarea>

              <div class="d-flex gap-3">
                <button class="btn btn-primary w-50" onclick="generateTasks()">
                  <i class="fa-solid fa-magic"></i> Generate Tasks
                </button>
                <button class="btn btn-sm btn-danger w-50" onclick="resetAll()">
                  <i class="fa-solid fa-trash"></i> Reset
                </button>
              </div>
            </div>
          </div>
        </div>

        <!-- RIGHT PANEL -->
        <div class="col-lg-7 right-panel">
          <div id="dateHeader" class="mb-3 fw-bold fs-5 text-primary"></div>

          <div class="card mb-3">
            <div class="card-body">
              <div
                class="d-flex justify-content-between align-items-center mb-2"
              >
                <div>
                  <span>Total: <strong id="totalTask">0</strong></span>
                  <span class="ms-3"
                    >Done: <strong id="completedTask">0</strong></span
                  >
                </div>
              </div>
              <div class="progress" style="height: 8px">
                <div id="progressBar" class="progress-bar bg-primary"></div>
              </div>
            </div>
          </div>

          <div id="taskList" class="d-flex flex-column gap-3"></div>
        </div>
      </div>
    </div>

    <script src="script.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  </body>
</html>
